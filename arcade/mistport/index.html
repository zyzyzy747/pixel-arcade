<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雾港追迹 · Mistport</title>
<style>
  :root { --ink:#0c0f14; --fog:#8fb3b8; --brass:#d9a441; }
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; height:100%; background:var(--ink); overflow:hidden;
    font-family: "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif; color:var(--fog); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 40%, #161c24 0%, #07090d 70%); }
  canvas#screen { display:block; image-rendering: pixelated; background:#0b0e13;
    box-shadow: 0 0 0 1px #26303c, 0 18px 60px rgba(0,0,0,.8); }
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; background:#07090d; z-index:9; }
  #boot b { color:var(--brass); letter-spacing:.3em; font-size:15px; }
  #boot small { opacity:.55; font-size:12px; }
  #boot.err { color:#e07a5f; }
  #boot pre { max-width:80vw; max-height:50vh; overflow:auto; font-size:11px; color:#e07a5f; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="960" height="600"></canvas></div>
<div id="boot"><b>雾港追迹</b><small>正在铸造像素…</small></div>

<script>
  /* 外部素材开关：默认关闭（游戏全部美术由 src/art.js 程序化生成，零外部依赖）。
     想用 assets/ 下自己放的图，把下面改成 true 即可，命名对照见 assets/README.md。 */
  window.MISTPORT_USE_EXTERNAL_ASSETS = false;
</script>
<script src="src/util.js"></script>
<script src="src/artslots.js"></script>
<script src="src/art.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/maps.js"></script>
<script src="src/story.js"></script>
<script src="src/world.js"></script>
<script src="src/entity.js"></script>
<script src="src/stealth.js"></script>
<script src="src/casino.js"></script>
<script src="src/ui.js"></script>
<script src="src/save.js"></script>
<script src="src/game.js"></script>
<script>
  window.addEventListener("error", function (e) {
    var b = document.getElementById("boot");
    b.className = "err";
    b.innerHTML = "<b>启动失败</b><pre>" + (e.error && e.error.stack ? e.error.stack : e.message) + "</pre>";
  });
  window.addEventListener("load", function () {
    try {
      MP.game.boot(document.getElementById("screen"));
      document.getElementById("boot").style.display = "none";
    } catch (err) {
      var b = document.getElementById("boot");
      b.className = "err";
      b.innerHTML = "<b>启动失败</b><pre>" + (err && err.stack ? err.stack : err) + "</pre>";
      throw err;
    }
  });
</script>
</body>
</html>
