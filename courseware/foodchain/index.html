<title>食物链与食物网 · 3D 互动课件</title>

<!-- ===== 样式：深色科技风 #0a1628 + 青蓝主色 + 高亮橙 ===== -->
<style>
:root{
  --bg:#0a1628; --bg2:#0c1b30; --panel:#0e1f38; --panel2:#122842; --line:#1d3a5f;
  --cyan:#4fd1c5; --orange:#ff9f43; --text:#e9f3ff; --dim:#9db4cd; --dim2:#6d86a3;
  --green:#43d17a; --yellow:#ffd166; --red:#ff6b6b; --purple:#a96bff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ================= 整体布局 ================= */
#app{display:flex;flex-direction:column;height:100vh}

/* ---- 顶部：标题 + 场景 Tab + 演示按钮 ---- */
#topbar{
  height:66px;flex:0 0 66px;display:flex;align-items:center;gap:18px;padding:0 20px;
  background:linear-gradient(180deg,#0f2540,#0a1628);border-bottom:1px solid var(--line);z-index:20;
}
#topbar .logo{display:flex;align-items:center;gap:10px;flex:0 0 auto}
#topbar .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
#topbar h1{font-size:19px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
#topbar h1 small{display:block;font-size:11px;font-weight:400;color:var(--dim2);letter-spacing:1.5px;margin-top:2px}
.tabs{display:flex;gap:8px;margin-left:6px}
.tab{
  padding:9px 18px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--dim);
  background:#102b47;border:1px solid #1d3a5f;transition:.2s;white-space:nowrap;
}
.tab:hover:not(.locked){color:#fff;border-color:var(--cyan)}
.tab.active{background:linear-gradient(135deg,#1a4d5e,#14405a);color:#fff;border-color:var(--cyan);box-shadow:0 0 14px rgba(79,209,197,.25)}
.tab.locked{opacity:.45;cursor:not-allowed}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn-demo{
  padding:9px 18px;border-radius:9px;font-size:14px;font-weight:700;
  background:linear-gradient(135deg,#ff9f43,#ff7a45);color:#241300;box-shadow:0 3px 12px rgba(255,159,67,.3);
}
.btn-demo:hover{filter:brightness(1.1)}
.progress-chip{
  font-size:12.5px;color:var(--dim);background:#0d2135;border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;white-space:nowrap;
}
.progress-chip b{color:var(--cyan);font-size:14px}

/* ---- 中部：舞台 + 右侧面板 ---- */
#middle{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#12304f 0%,#0a1628 70%)}
#cv{position:absolute;inset:0;display:block}

/* ================= 3D 标签（屏幕投影 HTML） ================= */
#tagLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag3d{
  position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  padding:4px 10px;border-radius:7px;font-size:13px;white-space:nowrap;
  background:rgba(10,26,46,.82);border:1px solid #2b5580;color:#d8e8fa;
  backdrop-filter:blur(4px);transition:border-color .2s,background .2s,color .2s;user-select:none;
}
.tag3d i{display:block;font-style:normal;font-size:10.5px;color:var(--dim2);margin-top:1px}
.tag3d:hover{border-color:var(--cyan);color:#fff}
.tag3d.hl{background:rgba(20,64,80,.9);border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(79,209,197,.35)}
.tag3d.hl i{color:#8fded4}
.tag3d.lv{background:rgba(12,32,55,.6);border-color:#28507a;color:#a9c6e4;font-size:12px}
.tag3d.prod{background:rgba(255,159,67,.16);border-color:var(--orange);color:#ffd7a8}
.tag3d.step{
  background:rgba(79,209,197,.18);border-color:var(--cyan);color:#bff3ec;
  font-size:12px;padding:2px 8px;border-radius:20px;
}
.tag3d.gone{opacity:.35;text-decoration:line-through;cursor:default}
.tag3d.chainon{background:rgba(67,209,122,.18);border-color:var(--green);color:#c9f7db}

/* ================= 左下角图例 ================= */
#legend{
  position:absolute;left:16px;bottom:16px;background:rgba(9,22,40,.78);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:12px;color:var(--dim);backdrop-filter:blur(6px);z-index:5;
}
#legend .lg-t{color:#fff;font-size:12.5px;font-weight:700;margin-bottom:7px}
#legend .lg{display:flex;align-items:center;gap:7px;margin:4px 0}
#legend .sw{width:12px;height:12px;border-radius:3px;flex:0 0 12px}
#legend .arrow{color:var(--cyan);font-size:13px}

/* ================= 状态胶囊（录屏一眼看懂） ================= */
#capsule{
  position:absolute;top:16px;left:50%;transform:translateX(-50%) translateY(-14px);
  padding:11px 26px;border-radius:26px;font-size:19px;font-weight:800;letter-spacing:.5px;
  background:rgba(12,32,55,.9);border:1px solid var(--cyan);color:#d9fff9;
  box-shadow:0 6px 26px rgba(0,0,0,.45), 0 0 18px rgba(79,209,197,.18);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;z-index:8;white-space:nowrap;max-width:90%;
}
#capsule.show{opacity:1;transform:translateX(-50%) translateY(0)}
#capsule.hot{border-color:var(--orange);color:#ffe4c4;box-shadow:0 6px 26px rgba(0,0,0,.45),0 0 18px rgba(255,159,67,.25)}
#capsule.bad{border-color:var(--red);color:#ffd8d8;box-shadow:0 6px 26px rgba(0,0,0,.45),0 0 18px rgba(255,107,107,.25)}
#capsule.good{border-color:var(--green);color:#d6ffe6;box-shadow:0 6px 26px rgba(0,0,0,.45),0 0 18px rgba(67,209,122,.25)}

#hintBar{
  position:absolute;top:62px;left:50%;transform:translateX(-50%);
  font-size:13px;color:var(--dim2);opacity:0;transition:opacity .3s;z-index:6;white-space:nowrap;
}
#hintBar.show{opacity:1}

/* ================= 右侧知识面板 ================= */
#panel{
  width:348px;flex:0 0 348px;background:linear-gradient(180deg,#0e1f38,#0a1728);
  border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:10;
}
#panel .p-head{padding:15px 18px 12px;border-bottom:1px solid var(--line)}
#panel .p-head .kicker{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:700}
#panel .p-head h2{font-size:17px;margin-top:5px;font-weight:800}
#panel .p-body{flex:1;overflow-y:auto;padding:14px 18px 20px}
#panel .p-body::-webkit-scrollbar{width:7px}
#panel .p-body::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:4px}
.blk{margin-bottom:16px}
.blk h3{font-size:13.5px;color:var(--cyan);margin-bottom:7px;font-weight:700;letter-spacing:.5px}
.blk p{font-size:13.2px;line-height:1.85;color:#c8dcee}
.blk p.big{font-size:14px;color:#e6f3ff}
.role{display:flex;gap:9px;align-items:flex-start;margin:9px 0}
.role .sw{width:14px;height:14px;border-radius:4px;margin-top:3px;flex:0 0 14px}
.role .rt{font-size:13.2px;font-weight:700;color:#fff}
.role .rd{font-size:12.2px;color:var(--dim);line-height:1.6;margin-top:1px}
.rule{display:flex;gap:8px;margin:8px 0;font-size:13px;line-height:1.7;color:#c8dcee}
.rule .no{width:19px;height:19px;border-radius:50%;background:#14405a;color:var(--cyan);
  font-size:11.5px;display:flex;align-items:center;justify-content:center;flex:0 0 19px;font-weight:700;margin-top:2px}
.chainline{
  background:#0b1e33;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  font-size:14px;color:#bff3ec;line-height:1.9;min-height:46px;word-break:break-all;
}
.chainline .arrow{color:var(--cyan);margin:0 5px;font-weight:700}
.chainline .empty{color:var(--dim2);font-size:13px}
.eqn{
  background:#0b1e33;border:1px solid var(--line);border-left:3px solid var(--orange);
  border-radius:6px;padding:9px 12px;font-size:13.5px;color:#ffe0bd;margin:8px 0;line-height:1.7;
}
/* 能量金字塔（CSS 梯形） */
.pyramid{margin:10px 0 4px}
.pyr-row{
  height:36px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;gap:8px;
  clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);color:#08131f;font-weight:800;font-size:12.5px;
}
.pyr-row span{font-weight:700;opacity:.85}
.pyr-cap{font-size:11.5px;color:var(--dim2);text-align:center;margin-top:6px;line-height:1.6}
.kcard{
  background:linear-gradient(135deg,#12354f,#0d2439);border:1px solid #2b5580;border-radius:10px;
  padding:13px 15px;margin-bottom:14px;
}
.kcard .kf{font-size:26px;font-weight:900;color:var(--cyan);letter-spacing:1px}
.kcard .kn{font-size:14px;color:#fff;font-weight:700;margin:3px 0 7px}
.kcard .kd{font-size:13px;line-height:1.85;color:#c8dcee}
.kcard .ktag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;margin-top:9px;font-weight:700}
.btn-back{
  width:100%;margin-top:4px;padding:8px;border-radius:8px;font-size:13px;font-weight:700;
  background:#122c47;border:1px solid var(--line);color:var(--cyan);
}
.btn-back:hover{background:#17415f}

/* ================= 底部功能按钮条 ================= */
#bottombar{
  flex:0 0 auto;min-height:78px;display:flex;align-items:center;gap:10px;padding:11px 18px;
  background:linear-gradient(0deg,#0b1e34,#0a1628);border-top:1px solid var(--line);flex-wrap:wrap;z-index:15;
}
.tools{display:none;gap:10px;align-items:center;flex-wrap:wrap}
.tools.active{display:flex}
.btn{
  padding:10px 17px;border-radius:9px;font-size:14px;font-weight:700;
  background:#123049;border:1px solid #24507c;color:#cfe6fb;transition:.18s;white-space:nowrap;
}
.btn:hover{background:#17415f;border-color:var(--cyan);color:#fff;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#17707a,#125e78);border-color:var(--cyan);color:#eafffb}
.btn.primary:hover{filter:brightness(1.15)}
.btn.warn{background:#3a2415;border-color:#7a4b1f;color:#ffcf9a}
.btn.warn:hover{background:#4d2f1a;border-color:var(--orange)}
.btn.danger{background:#3a1a1a;border-color:#7a2f2f;color:#ffbdbd}
.btn.danger:hover{background:#4d2222;border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.bb-note{font-size:12px;color:var(--dim2)}

/* ================= 引导 / 离线提示 ================= */
#boot{
  position:fixed;inset:0;background:#0a1628;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:999;
}
#boot .ring{width:42px;height:42px;border:3px solid #1d3a5f;border-top-color:var(--cyan);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boot .t{font-size:15px;color:var(--dim)}
#boot .err{max-width:560px;text-align:center;font-size:14px;line-height:1.9;color:#ffc7a8}
#boot .err code{background:#12283f;padding:2px 7px;border-radius:4px;color:var(--cyan);font-size:13px}

/* ================= 选择题弹窗 ================= */
.mask{
  position:fixed;inset:0;background:rgba(4,12,24,.76);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:200;
}
.mask.show{display:flex}
.qbox{
  width:600px;max-width:92vw;background:linear-gradient(180deg,#102a44,#0b1c30);
  border:1px solid #2b5580;border-radius:16px;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.qbox .qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.qbox .qno{font-size:12.5px;color:var(--cyan);font-weight:700;letter-spacing:1px}
.qbox .qclose{font-size:20px;color:var(--dim);line-height:1;padding:0 4px}
.qbox .qclose:hover{color:#fff}
.qbox .qtext{font-size:17px;line-height:1.7;font-weight:700;margin-bottom:16px;color:#fff}
.opt{
  display:block;width:100%;text-align:left;padding:12px 15px;margin:8px 0;border-radius:10px;
  background:#0d2135;border:1px solid var(--line);font-size:14.5px;color:#d3e5f7;transition:.16s;
}
.opt:hover{border-color:var(--cyan);background:#123049}
.opt.correct{background:rgba(67,209,122,.16);border-color:var(--green);color:#d6ffe6}
.opt.wrong{background:rgba(255,107,107,.14);border-color:var(--red);color:#ffd8d8}
.opt:disabled{cursor:default}
.expl{
  margin-top:14px;padding:12px 15px;border-radius:10px;font-size:13.5px;line-height:1.85;display:none;
}
.expl.ok{display:block;background:rgba(67,209,122,.12);border:1px solid #2f7d52;color:#cdf5dd}
.expl.no{display:block;background:rgba(255,107,107,.12);border:1px solid #7d3434;color:#ffd8d8}
.qfoot{display:flex;gap:10px;margin-top:16px}
.btn-next{margin-left:auto;padding:10px 22px;border-radius:9px;font-size:14px;font-weight:700;
  background:linear-gradient(135deg,#17707a,#125e78);border:1px solid var(--cyan);color:#eafffb}
#finishMask .qbox{text-align:center}
.finish-big{font-size:24px;font-weight:900;color:var(--cyan);margin-bottom:10px}
.finish-sub{font-size:14px;color:#c8dcee;line-height:1.9}

/* ================= 演示模式 ================= */
body.demo-mode #topbar,
body.demo-mode #panel,
body.demo-mode #bottombar,
body.demo-mode #legend,
body.demo-mode #hintBar{opacity:0;pointer-events:none;transition:opacity .4s ease}
#demoExit{
  position:fixed;right:22px;bottom:20px;font-size:13px;color:rgba(255,255,255,.55);
  background:rgba(0,0,0,.35);padding:8px 15px;border-radius:20px;display:none;z-index:300;
}
body.demo-mode #demoExit{display:block}
#summary{
  position:fixed;inset:0;background:#04080f;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 1s ease;z-index:280;
}
#summary.show{opacity:1}
#summary .st{
  font-size:34px;font-weight:900;letter-spacing:2px;text-align:center;line-height:1.6;
  background:linear-gradient(90deg,#4fd1c5,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding:0 40px;
}
</style>

const TAGS = [];

function addTag(scKey, text, sub, pos, cls, onClick) {
  const el = document.createElement('div');
  el.className = 'tag3d' + (cls ? ' ' + cls : '');
  el.innerHTML = '<b>' + text + '</b>' + (sub ? '<i>' + sub + '</i>' : '');
  if (onClick) {
    el.addEventListener('click', function (e) { e.stopPropagation(); onClick(e); });
  } else {
    el.style.pointerEvents = 'none';
  }
  tagLayer.appendChild(el);
  const t = { el:el, pos:pos.clone(), scene:scKey, hidden:false, dead:false };
  TAGS.push(t);
  t.destroy = function () {
    t.dead = true;
    if (el.parentNode) el.parentNode.removeChild(el);
    const i = TAGS.indexOf(t); if (i >= 0) TAGS.splice(i, 1);
  };
  return t;
}
function updateTags() {
  const w = stage.clientWidth, h = stage.clientHeight;
  for (let i = 0; i < TAGS.length; i++) {
    const t = TAGS[i];
    if (t.dead) continue;
    if (t.scene !== currentScene || t.hidden) { t.el.style.display = 'none'; continue; }
    _pv.copy(t.pos).project(camera);
    if (_pv.z > 1) { t.el.style.display = 'none'; continue; }
    t.el.style.display = '';
    t.el.style.left = ((_pv.x * 0.5 + 0.5) * w) + 'px';
    t.el.style.top = ((-_pv.y * 0.5 + 0.5) * h) + 'px';
  }
}

  if (p) mesh.position.set(p[0], p[1], p[2]);

/* ==================================================================
   7. 场景构建
   ================================================================== */
const SC = {};   // { A:{scene,root,orgs,edges,picks,...}, ... }

/** 建地面 + 土层 */
function buildGround(parent) {
  const g = new THREE.Group();
  const soil = new THREE.Mesh(new THREE.CylinderGeometry(7.4, 6.7, 2.2, 56),
    mat(0x33251a, { roughness:1 }));
  soil.position.y = -1.12; g.add(soil);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 7.5, 0.16, 56),
    mat(0x1e4630, { roughness:.95 }));
  top.position.y = -0.08; g.add(top);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(7.5, 0.05, 8, 64),
    new THREE.MeshBasicMaterial({ color:0x2f6b4a }));
  rim.rotation.x = Math.PI / 2; rim.position.y = 0.01; g.add(rim);
  parent.add(g);
  return g;
}

/** 建营养级分层圆盘（半透明） */
function buildLevelPlate(parent, y, color) {
  const r = new THREE.Mesh(new THREE.RingGeometry(0.6, 6.9, 56),
    new THREE.MeshBasicMaterial({ color:color, transparent:true, opacity:0.075,
      side:THREE.DoubleSide, depthWrite:false }));
  r.rotation.x = -Math.PI / 2;
  r.position.y = y - 0.55;
  parent.add(r);
  return r;
}

/** 为一个场景构建完整群落 */
function buildCommunity(key) {
  const sc = new THREE.Scene();
  const obj = { scene:sc, key:key, root:new THREE.Group(), orgs:{}, orgList:[],
                edges:[], picks:[], hl:{}, removed:{}, plates:[], edgeGroup:new THREE.Group(),
                chain:[], chainTags:[], chainCount:0, webOn:false, energyOn:false };
  sc.add(obj.root);
  addLights(sc);
  buildGround(obj.root);
  obj.root.add(obj.edgeGroup);

  const LV_Y = { 1:0.15, 2:2.05, 3:3.85, 4:5.55 };
  /* 营养级分层圆盘 */
  [1, 2, 3, 4].forEach(function (lv) {
    const col = lv === 1 ? 0x43d17a : lv === 2 ? 0xffd166 : lv === 3 ? 0xff9f43 : 0xff6b6b;
    obj.plates.push(buildLevelPlate(obj.root, LV_Y[lv], col));
  });
  /* 分解者小圈 */
  const dr = new THREE.Mesh(new THREE.RingGeometry(0.4, 2.5, 48),
    new THREE.MeshBasicMaterial({ color:0xa96bff, transparent:true, opacity:0.08,
      side:THREE.DoubleSide, depthWrite:false }));
  dr.rotation.x = -Math.PI / 2; dr.position.set(0, -0.4, 3.5); obj.root.add(dr);

  /* 逐个生物建模 */
  ORG_DEFS.forEach(function (def, idx) {
    const b = BUILDERS[def.build];
    if (!b) { console.warn('[课件] 缺少模型构建器：' + def.build); return; }
    const g = b();
    g.position.set(def.pos[0], def.pos[1], def.pos[2]);

    /* 每个生物的材质单独克隆，便于高亮 / 淡出 */
    const mats = [];
    g.traverse(function (o) {
      if (o.isMesh && o.material && o.material !== PICK_MAT) {
        o.material = o.material.clone();
        mats.push({ m:o.material,
                    e:o.material.emissive ? o.material.emissive.getHex() : 0x000000,
                    ei:o.material.emissiveIntensity !== undefined ? o.material.emissiveIntensity : 1 });
      }
    });

    /* 拾取代理球（不渲染，仅用于射线点击） */
    const pk = new THREE.Mesh(G_SPH, PICK_MAT);
    pk.scale.setScalar(def.pick || 1.0);
    pk.position.y = 0.62;
    pk.userData.orgId = def.id;
    g.add(pk);
    obj.picks.push(pk);

    obj.root.add(g);
    const org = { id:def.id, def:def, group:g, mats:mats, baseY:def.pos[1],
                  phase:idx * 1.31, wings:g.userData.wings || null, hl:false, dead:false };
    obj.orgs[def.id] = org;
    obj.orgList.push(org);
  });

  /* 生物名标签 */
  obj.orgList.forEach(function (org) {
    const d = org.def;
    const r = ROLE[d.role];
    const lp = new THREE.Vector3(d.pos[0], d.pos[1] + (d.id === 'eagle' ? 1.75 : 1.55), d.pos[2]);
    org.tag = addTag(key, d.name, r.name, lp, '', function () { onOrgClick(key, d.id); });
  });

  /* 营养级侧边标签 */
  [1, 2, 3, 4].forEach(function (lv) {
    const rn = ['', '第一营养级', '第二营养级', '第三营养级', '第四营养级'][lv];
    const sub = ['', '生产者', '初级消费者', '次级消费者', '三级消费者'][lv];
    addTag(key, rn, sub, new THREE.Vector3(-7.4, LV_Y[lv], 0), 'lv', null);
  });
  addTag(key, '分解者', '真菌与细菌', new THREE.Vector3(0, 0.2, 5.2), 'lv', null);

  /* 尝试加载 GLB：成功则替换程序化模型，失败静默回退 */
  loadGLB(key, obj);

  return obj;
}

/** GLB 加载（失败自动回退，控制台仅打警告） */
function loadGLB(key, obj) {
  const url = GLB_PATHS[key];
  if (!url || typeof THREE.GLTFLoader !== 'function') return;
  const loader = new THREE.GLTFLoader();
  loader.load(url, function (gltf) {
    const m = gltf.scene;
    const box = new THREE.Box3().setFromObject(m);
    const size = box.getSize(new THREE.Vector3());
    const k = 9 / Math.max(size.x, size.y, size.z, 0.001);
    m.scale.setScalar(k);
    obj.root.add(m);
    if (gltf.animations && gltf.animations.length) {
      const mixer = new THREE.AnimationMixer(m);
      gltf.animations.forEach(function (c) { mixer.clipAction(c).play(); });
      obj.mixer = mixer;
    }
    console.log('[课件] 场景 ' + key + ' 已加载模型：' + url);
  }, undefined, function () {
    console.warn('[课件] 未找到模型 ' + url + '，已使用程序化模型兜底。');
  });
}

/* ==================================================================
   8. 高亮 / 移除 效果
   ================================================================== */
function setHighlight(key, id, on) {
  const obj = SC[key]; if (!obj) return;
  const org = obj.orgs[id]; if (!org || org.dead) return;
  org.hl = on;
  if (on) obj.hl[id] = true; else delete obj.hl[id];
  org.mats.forEach(function (x) {
    if (!x.m.emissive) return;
    if (on) { x.m.emissive.setHex(0x2fbfae); x.m.emissiveIntensity = 0.5; }
    else { x.m.emissive.setHex(x.e); x.m.emissiveIntensity = x.ei; }
  });
  if (org.tag) org.tag.el.className = 'tag3d' + (on ? ' hl' : '');
}
function clearHighlight(key) {
  const obj = SC[key]; if (!obj) return;
  Object.keys(obj.hl).forEach(function (id) { setHighlight(key, id, false); });
}

/** 让某个生物"消失"（场景C 移除物种） */
function killOrg(key, id) {
  const obj = SC[key]; if (!obj) return;
  const org = obj.orgs[id]; if (!org || org.dead) return;
  org.dead = true;
  org.killT = 0;
  if (org.tag) { org.tag.el.className = 'tag3d gone'; }
  obj.removed[id] = true;
}
function reviveOrg(key, id) {
  const obj = SC[key]; if (!obj) return;
  const org = obj.orgs[id]; if (!org) return;
  org.dead = false; org.killT = 0;
  org.group.scale.setScalar(1);
  org.group.visible = true;
  if (org.tag) org.tag.el.className = 'tag3d';
  delete obj.removed[id];
}

/* ==================================================================
   9. 连线（食物链箭头）工具
   ================================================================== */
const ARROW_UP = new THREE.Vector3(0, 1, 0);
function makeEdge(obj, fromId, toId, opt) {
  opt = opt || {};
  const a = obj.orgs[fromId], b = obj.orgs[toId];
  if (!a || !b) return null;
  const pa = a.group.position.clone(), pb = b.group.position.clone();
  /* 两端各缩一点，避免箭头插进生物体内 */
  const dir = pb.clone().sub(pa);
  const len = dir.length(); dir.normalize();
  const p0 = pa.clone().addScaledVector(dir, Math.min(0.95, len * 0.22));
  const p1 = pb.clone().addScaledVector(dir, -Math.min(1.05, len * 0.26));
  const mid = p0.clone().add(p1).multiplyScalar(0.5);
  mid.y += Math.max(0.55, p0.distanceTo(p1) * 0.16);
  mid.z += 0.12;
  const curve = new THREE.QuadraticBezierCurve3(p0, mid, p1);

  const g = new THREE.Group();
  const color = opt.color !== undefined ? opt.color : 0x4fd1c5;
  const tubeMat = new THREE.MeshStandardMaterial({
    color:color, emissive:color, emissiveIntensity:0.55,
    transparent:true, opacity:opt.opacity !== undefined ? opt.opacity : 0.85, roughness:0.35 });
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, opt.r || 0.048, 8, false), tubeMat);
  g.add(tube);

  /* 箭头（圆锥，指向捕食者） */
  const tan = curve.getTangentAt(1).normalize();
  const headMat = new THREE.MeshStandardMaterial({
    color:color, emissive:color, emissiveIntensity:0.7,
    transparent:true, opacity:opt.opacity !== undefined ? opt.opacity : 0.9, roughness:0.3 });
  const head = new THREE.Mesh(new THREE.ConeGeometry((opt.r || 0.048) * 3.6, 0.30, 14), headMat);
  head.position.copy(p1).addScaledVector(tan, 0.10);
  head.quaternion.setFromUnitVectors(ARROW_UP, tan);
  g.add(head);

  /* 沿曲线流动的粒子（代表能量流动） */
  const parts = [];
  const pc = opt.pcolor !== undefined ? opt.pcolor : 0xbff3ec;
  const pmat = new THREE.MeshBasicMaterial({ color:pc, transparent:true, opacity:0.95,
    blending:THREE.AdditiveBlending, depthWrite:false });
  const n = opt.pcount || 7;
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(G_SPH, pmat);
    m.scale.setScalar(0.062);
    m.userData.t = i / n;
    m.userData.sp = 0.34 + (i % 3) * 0.045;
    g.add(m); parts.push(m);
  }

  obj.edgeGroup.add(g);
  const e = { group:g, curve:curve, tube:tube, head:head, tubeMat:tubeMat, headMat:headMat,
              parts:parts, from:fromId, to:toId, pmat:pmat, broken:false };
  obj.edges.push(e);
  return e;
}
function removeEdge(obj, e) {
  if (!e) return;
  obj.edgeGroup.remove(e.group);
  e.tube.geometry.dispose(); e.head.geometry.dispose();
  const i = obj.edges.indexOf(e); if (i >= 0) obj.edges.splice(i, 1);
}
function clearEdges(obj) {
  obj.edges.slice().forEach(function (e) { removeEdge(obj, e); });
}

function panelB() {

function renderChain() {
  const obj = SC.B; if (!obj) return;
  const el = $('chainLine'); if (!el) return;
  if (!obj.chain.length) {
    el.innerHTML = '<span class="empty">还没有开始。请点击一株绿色植物（生产者）作为起点。</span>';
  } else {
    el.innerHTML = obj.chain.map(function (id, i) {
      return (i ? '<span class="arrow">→</span>' : '') + nameOf(id);
    }).join('') + '<br><span style="font-size:12px;color:#6d86a3">共 ' + obj.chain.length + ' 个环节</span>';
  }
  const cnt = $('chainCnt'); if (cnt) cnt.textContent = obj.chainCount;
  $('btnFinishChain').disabled = obj.chain.length < 3;
}

function chainPick(id) {
  if (chainBusy) return;
  const obj = SC.B;
  const def = ORG_BY_ID[id];
  if (obj.removed[id]) { capsule('该生物已被移除（仅在场景 C）', 'bad', 1600); return; }

  /* 起点：必须是生产者 */
  if (!obj.chain.length) {
    if (def.role !== 'producer') {
      capsule('✘ 食物链必须从生产者（绿色植物）开始！', 'bad', 2200);
      shakeOrg('B', id);
      hint('提示：先点「草」或「灌木」。');
      return;
    }
    obj.chain.push(id);
    setHighlight('B', id, true);
    capsule('起点：' + def.name + '（生产者）', 'hot', 1800);
    renderChain();
    return;
  }

  /* 已在链中 */
  if (obj.chain.indexOf(id) >= 0) {
    capsule('「' + def.name + '」已经在链条里了', 'bad', 1600);
    return;
  }
  if (def.role === 'decomposer') {
    capsule('✘ 食物链里不写分解者哦', 'bad', 2200);
    shakeOrg('B', id);
    hint('提示：食物链只包括生产者和消费者。');
    return;
  }

  const last = obj.chain[obj.chain.length - 1];
  /* 校验捕食关系 */
  const ok = LINKS.some(function (l) { return l[0] === last && l[1] === id; });
  if (!ok) {
    capsule('✘ 「' + nameOf(last) + '」不会被「' + def.name + '」直接吃掉', 'bad', 2600);
    shakeOrg('B', id);
    hint('提示：想一想谁吃谁，箭头要指向捕食者。');
    return;
  }

  /* 合法：连线 */
  obj.chain.push(id);
  const e = makeEdge(obj, last, id, { color:0x43d17a, pcount:8 });
  if (e) {
    e.chainEdge = true;
    const mp = e.curve.getPointAt(0.5);
    const tag = addTag('B', '第 ' + obj.chain.length + ' 环', nameOf(id), mp, 'step', null);
    obj.chainTags.push(tag);
  }
  setHighlight('B', id, true);
  renderChain();

  const n = obj.chain.length;
  const top = !LINKS.some(function (l) { return l[0] === id; });
  if (top && n >= 3) {
    capsule('✔ 完整食物链（' + n + ' 级）！顶级消费者是「' + def.name + '」', 'good', 3200);
    hint('点「✅ 完成本链」保存这条链，或继续加环。');
  } else {
    capsule('✔ 正确：' + nameOf(last) + ' → ' + def.name + '（第 ' + n + ' 环）', 'good', 2200);
  }
}

function shakeOrg(key, id) {
  const obj = SC[key]; if (!obj) return;
  const org = obj.orgs[id]; if (!org) return;
  org.shake = 0.55;
}

function undoChain() {
  const obj = SC.B; if (!obj) return;
  if (!obj.chain.length) { capsule('链条已经是空的', '', 1400); return; }
  const id = obj.chain.pop();
  setHighlight('B', id, false);
  /* 删除最后一条边 */
  for (let i = obj.edges.length - 1; i >= 0; i--) {
    if (obj.edges[i].chainEdge) { removeEdge(obj, obj.edges[i]); break; }
  }
  const t = obj.chainTags.pop(); if (t) t.destroy();
  renderChain();
  capsule('已撤销一步，当前 ' + obj.chain.length + ' 个环节', '', 1800);
}

function clearChain(silent) {
  const obj = SC.B; if (!obj) return;
  obj.chain.length = 0;
  obj.edges.slice().forEach(function (e) { if (e.chainEdge) removeEdge(obj, e); });
  obj.chainTags.forEach(function (t) { t.destroy(); });
  obj.chainTags.length = 0;
  clearHighlight('B');
  renderChain();
  if (!silent) capsule('链条已清空', '', 1500);
}

function finishChain() {
  const obj = SC.B; if (!obj) return;
  if (obj.chain.length < 3) { capsule('至少要 3 个环节才算一条食物链', 'bad', 2000); return; }
  obj.chainCount++;
  const txt = obj.chain.map(nameOf).join(' → ');
  capsule('🎉 第 ' + obj.chainCount + ' 条完成：' + txt, 'good', 3400);
  setTimeout(function () {
    clearChain(true);
    if (!isDemo()) maybeQuiz('B');
  }, 1500);
}

        if (!isDemo()) setTimeout(function () { maybeQuiz('B'); }, 1600);

function pyrRow(w, t, v, c) {
  return '<div class="pyr-row" style="width:' + w + '%;background:' + c + '">'
       + '<span>' + t + '</span><b>' + v + '</b></div>';
}

function showWeb() {
  const obj = SC.C; if (!obj) return;
  if (obj.webOn) { clearEdges(obj); obj.webOn = false; capsule('已收起食物网', '', 1400); return; }
  clearEdges(obj);
  LINKS.forEach(function (l, i) {
    if (obj.removed[l[0]] || obj.removed[l[1]]) return;
    const lv = lvOf(l[1]);
    const col = lv === 2 ? 0x43d17a : lv === 3 ? 0xffd166 : lv === 4 ? 0xff9f43 : 0xff6b6b;
    makeEdge(obj, l[0], l[1], { color:col, opacity:0.34, r:0.032, pcount:0 });
  });
  obj.webOn = true;
  obj.energyOn = false;
  capsule('食物网：' + LINKS.length + ' 条捕食关系交错成网', 'hot', 3000);
  hint('点「⚡ 能量流动」看能量怎么沿网流动。');
}

function runEnergy() {
  const obj = SC.C; if (!obj) return;
  if (!obj.webOn) { showWeb(); }
  obj.energyOn = !obj.energyOn;
  if (obj.energyOn) {
    /* 给每条边补上流动粒子 */
    obj.edges.forEach(function (e, i) {
      if (e.parts.length) return;
      const pc = 0xbff3ec;
      const pmat = new THREE.MeshBasicMaterial({ color:pc, transparent:true, opacity:0.95,
        blending:THREE.AdditiveBlending, depthWrite:false });
      const n = 5;
      for (let k = 0; k < n; k++) {
        const m = new THREE.Mesh(G_SPH, pmat);
        m.scale.setScalar(0.055);
        m.userData.t = (k / n + i * 0.13) % 1;
        m.userData.sp = 0.3 + (k % 3) * 0.05;
        e.group.add(m); e.parts.push(m);
      }
    });
    capsule('⚡ 能量沿食物网单向流动、逐级递减…', 'hot', 5200);
    hint('注意：箭头的方向就是能量流动的方向，不能倒流。');
    setTimeout(function () {
      if (obj.energyOn) { obj.energyOn = false; }
    }, 8000);
  } else {
    capsule('已停止能量流动演示', '', 1600);
  }
}

function toggleRemove() {
  removeMode = !removeMode;
  const b = $('btnRemove');
  b.textContent = removeMode ? '✂ 点生物移除（进行中）' : '✂ 移除物种';
  b.className = removeMode ? 'btn primary' : 'btn danger';
  capsule(removeMode ? '移除模式：请点击任意一个生物' : '已退出移除模式', removeMode ? 'bad' : '', 2400);
  if (removeMode) hint('点「♻ 恢复群落」可以还原。');
}

function doRemove(id) {
  const obj = SC.C;
  if (obj.removed[id]) { capsule('「' + nameOf(id) + '」已经被移除了', 'bad', 1600); return; }
  killOrg('C', id);
  /* 断开相连的边 */
  const affected = [];
  obj.edges.slice().forEach(function (e) {
    if (e.from === id || e.to === id) {
      e.tubeMat.color.setHex(0xff5252); e.tubeMat.emissive.setHex(0xff5252);
      e.headMat.color.setHex(0xff5252); e.headMat.emissive.setHex(0xff5252);
      e.broken = true; e.breakT = 0;
      if (e.from === id) affected.push(e.to); else affected.push(e.from);
    }
  });
  const prey = LINKS.filter(function (l) { return l[1] === id; }).map(function (l) { return nameOf(l[0]); });
  const pred = LINKS.filter(function (l) { return l[0] === id; }).map(function (l) { return nameOf(l[1]); });
  let msg = '移除「' + nameOf(id) + '」：';
  if (pred.length) msg += '捕食它的 ' + pred.join('、') + ' 会食物短缺而减少；';
  if (prey.length) msg += '被它吃的 ' + prey.join('、') + ' 会因天敌减少而暴增。';
  capsule(msg, 'bad', 5200);
  hint('食物网牵一发而动全身 —— 这就是生态平衡容易被破坏的原因。');
  removeMode = false;
  const b = $('btnRemove'); b.textContent = '✂ 移除物种'; b.className = 'btn danger';
}

function restoreAll() {
  const obj = SC.C; if (!obj) return;
  Object.keys(obj.removed).forEach(function (id) { reviveOrg('C', id); });
  obj.removed = {};
  clearEdges(obj);
  obj.webOn = false; obj.energyOn = false;
  capsule('群落已恢复原状 ♻', 'good', 2200);
}

    h += '<div class="lg"><span class="sw" style="background:' + r.hex + '"></span>' + r.name + '</div>';
  });
  h += '<div class="lg" style="margin-top:7px"><span class="arrow">→</span>箭头 = 能量流动方向</div>';
  legendEl.innerHTML = h;
}

/* ==================================================================
   14. 随堂选择题 + 解锁
   ================================================================== */
let quizIdx = -1, quizLocked = false, answered = false;

function quizOfScene(sc) {
  const r = [];
  QUIZ.forEach(function (q) { if (q.scene === sc) r.push(q.id); });
  return r;
}
function openQuiz(sc) {
  const ids = quizOfScene(sc);
  let pick = -1;
  for (let i = 0; i < ids.length; i++) { if (!PROG[sc][i]) { pick = ids[i]; break; } }
  if (pick < 0) {
    const all = ids.every(function (_, i) { return PROG[sc][i]; });
    if (all) { capsule('本场景的题目已经全部答对啦 👍', 'good', 2400); }
    return;
  }
  quizIdx = pick; quizLocked = true;
  renderQuiz();
  qMask.classList.add('show');
}
function maybeQuiz(sc) {
  if (isDemo()) return;
  const ids = quizOfScene(sc);
  const done = ids.every(function (id) { return QUIZ[id].done; });
  if (done) return;
  setTimeout(function () { openQuiz(sc); }, 500);
}
function renderQuiz() {
  const q = QUIZ[quizIdx];
  answered = false;
  const ids = quizOfScene(q.scene);
  const nth = ids.indexOf(q.id) + 1, total = ids.length;
  const gDone = QUIZ.filter(function (x) { return x.done; }).length;
  qNo.textContent = '场景 ' + q.scene + ' · 第 ' + nth + '/' + total + ' 题（总进度 ' + gDone + '/6）';
  qText.textContent = q.q;
  qExpl.className = 'expl'; qExpl.textContent = '';
  qNext.style.display = 'none';
  qOpts.innerHTML = '';
  q.opts.forEach(function (t, i) {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = 'ABCD'.charAt(i) + '. ' + t;
    b.addEventListener('click', function () { answer(i, b); });
    qOpts.appendChild(b);
  });
}
function answer(i, btn) {
  if (answered) return;
  answered = true;
  const q = QUIZ[quizIdx];
  const btns = qOpts.querySelectorAll('.opt');
  if (i === q.ans) {
    btn.classList.add('correct');
    qExpl.className = 'expl ok';
    qExpl.innerHTML = '✅ <b>答对了！</b> ' + q.expl;
    q.done = true;
    const ids = quizOfScene(q.scene);
    PROG[q.scene][ids.indexOf(q.id)] = true;
    updateProgress();
    const allScene = ids.every(function (id) { return QUIZ[id].done; });
    if (allScene) unlockNext(q.scene);
    const allDone = QUIZ.every(function (x) { return x.done; });
    qNext.style.display = '';
    qNext.textContent = allDone ? '查看成绩 🎉' : '下一题 →';
  } else {
    btn.classList.add('wrong');
    Array.prototype.forEach.call(btns, function (b, k) { if (k === q.ans) b.classList.add('correct'); });
    qExpl.className = 'expl no';
    qExpl.innerHTML = '❌ <b>再想想～</b> ' + q.expl + '<br><span style="color:#9db4cd">看完解析后，再选一次正确答案。</span>';
    qNext.style.display = 'none';
    setTimeout(function () { answered = false; }, 400);
  }
}
function updateProgress() {
  const n = QUIZ.filter(function (q) { return q.done; }).length;
  $('pgText').textContent = n + '/6';
}
function unlockNext(sc) {
  if (sc === 'A' && !UNLOCKED.B) {
    UNLOCKED.B = true;
    document.querySelector('.tab[data-scene="B"]').textContent = 'B 连食物链';
    document.querySelector('.tab[data-scene="B"]').classList.remove('locked');
    capsule('🔓 场景 B「连食物链」已解锁！', 'good', 3600);
  } else if (sc === 'B' && !UNLOCKED.C) {
    UNLOCKED.C = true;
    document.querySelector('.tab[data-scene="C"]').textContent = 'C 食物网与能量';
    document.querySelector('.tab[data-scene="C"]').classList.remove('locked');
    capsule('🔓 场景 C「食物网与能量」已解锁！', 'good', 3600);
  }
}
function closeQuiz() {
  qMask.classList.remove('show');
  quizIdx = -1; quizLocked = false; answered = false;
}
qNext.addEventListener('click', function () {
  const q = QUIZ[quizIdx];
  if (!q) { closeQuiz(); return; }
  const allDone = QUIZ.every(function (x) { return x.done; });
  if (allDone) { closeQuiz(); finishMask.classList.add('show'); return; }
  const ids = quizOfScene(q.scene);
  let next = -1;
  for (let i = 0; i < ids.length; i++) { if (!PROG[q.scene][i]) { next = ids[i]; break; } }
  if (next >= 0) { quizIdx = next; renderQuiz(); }
  else {
    /* 本场景答完，跳到下一场景未答的题 */
    let n2 = -1;
    for (let i = 0; i < QUIZ.length; i++) { if (!QUIZ[i].done) { n2 = i; break; } }
    if (n2 >= 0 && UNLOCKED[QUIZ[n2].scene]) { quizIdx = n2; renderQuiz(); }
    else { closeQuiz(); }
  }
});
$('qClose').addEventListener('click', closeQuiz);
qMask.addEventListener('click', function (e) { if (e.target === qMask) closeQuiz(); });
$('finishClose').addEventListener('click', function () { finishMask.classList.remove('show'); });

/* ==================================================================
   15. 演示模式（25 秒时间轴）
   ================================================================== */
function isDemo() { return DEMO.on; }
function demoTimer(fn, ms) { DEMO.timers.push(setTimeout(fn, ms)); }

function startDemo() {
  if (DEMO.on) return;
  DEMO.on = true;
  document.body.classList.add('demo-mode');
  hideCapsule();
  /* 记录现场 */
  DEMO.restore = {
    scene:currentScene,
    chain:SC.B ? SC.B.chain.slice() : [],
    webOn:SC.C ? SC.C.webOn : false,
  };
  clearChain(true);
  stopTour();

  goScene('A', true);

  /* 0–8s：场景 A 依次高亮五个角色 */
  demoTimer(function () { runTour(); }, 200);

  /* 8–16s：场景 B 自动连链 */
  demoTimer(function () {
    stopTour();
    goScene('B', true);
    capsule('场景 B · 连一条食物链', 'hot', 2400);
  }, 8000);
  demoTimer(function () { demoChain(CHAINS[1]); }, 8900);

  /* 16–23s：场景 C 食物网 + 能量流动 + 移除物种 */
  demoTimer(function () {
    goScene('C', true);
    capsule('场景 C · 食物网与能量流动', 'hot', 2600);
  }, 16000);
  demoTimer(function () { showWeb(); }, 16600);
  demoTimer(function () { runEnergy(); }, 18200);
  demoTimer(function () { doRemove('snake'); }, 20200);

  /* 23–25s：总结语 */
  demoTimer(function () { summaryEl.classList.add('show'); }, 23000);
  demoTimer(function () { stopDemo(); }, 25000);
}

function stopDemo() {
  if (!DEMO.on) return;
  DEMO.timers.forEach(clearTimeout);
  DEMO.timers.length = 0;
  DEMO.on = false;
  document.body.classList.remove('demo-mode');
  summaryEl.classList.remove('show');
  /* 还原 */
  stopTour();
  if (SC.B) { clearChain(true); SC.B.chainCount = 0; }
  if (SC.C) restoreAll();
  clearHighlight('A'); clearHighlight('B'); clearHighlight('C');
  goScene('A', true);
  capsule('已退出演示模式', '', 2000);
}

/* --- 射线拾取 --- */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
function pickAt(cx, cy) {
  const obj = SC[currentScene]; if (!obj) return null;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((cx - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((cy - rect.top) / rect.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(obj.picks, false);
  for (let i = 0; i < hits.length; i++) {
    const id = hits[i].object.userData.orgId;
    if (!id) continue;
    if (obj.removed[id]) continue;
    return id;
  }
  return null;
}
let downXY = null;
renderer.domElement.addEventListener('pointerdown', function (e) { downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', function (e) {
  if (!downXY) return;
  const moved = Math.abs(e.clientX - downXY[0]) + Math.abs(e.clientY - downXY[1]);
  downXY = null;
  if (moved > 6) return;            /* 拖动过就不算点击 */
  if (isDemo()) return;
  const id = pickAt(e.clientX, e.clientY);
  if (id) onOrgClick(currentScene, id);
});
renderer.domElement.addEventListener('pointermove', function (e) {
  if (isDemo()) { renderer.domElement.style.cursor = 'default'; return; }
  renderer.domElement.style.cursor = pickAt(e.clientX, e.clientY) ? 'pointer' : 'grab';
});

/* ==================================================================
   17. 主循环
   ================================================================== */
const clock = new THREE.Clock();
let elapsed = 0;

function updateEdges(obj, dt) {
  for (let i = obj.edges.length - 1; i >= 0; i--) {
    const e = obj.edges[i];
    /* 断链淡出 */
    if (e.broken) {
      e.breakT += dt;
      const k = Math.min(1, e.breakT / 0.8);
      e.tubeMat.opacity = 0.85 * (1 - k);
      e.headMat.opacity = 0.9 * (1 - k);
      e.parts.forEach(function (p) { p.visible = false; });
      if (k >= 1) { removeEdge(obj, e); }
      continue;
    }
    /* 粒子沿曲线流动（能量流动） */
    const on = e.chainEdge || obj.energyOn;
    e.parts.forEach(function (p) {
      if (!on) { p.visible = false; return; }
      p.visible = true;
      p.userData.t += dt * p.userData.sp;
      if (p.userData.t > 1) p.userData.t -= 1;
      const pt = e.curve.getPointAt(p.userData.t);
      p.position.copy(pt);
      const s = 0.055 + 0.02 * Math.sin(p.userData.t * Math.PI);
      p.scale.setScalar(s);
    });
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* 相机补间 */
  if (camTween) {
    camTween.t += dt;
    const k = clamp(camTween.t / camTween.d, 0, 1);
    const e = easeInOut(k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (k >= 1) camTween = null;
  }
  if (autoSpin && !camTween && !isDemo()) {
    const r = Math.sqrt(Math.pow(camera.position.x - controls.target.x, 2) +
                        Math.pow(camera.position.z - controls.target.z, 2));
    const a = Math.atan2(camera.position.z - controls.target.z,
                         camera.position.x - controls.target.x) + dt * 0.16;
    camera.position.x = controls.target.x + Math.cos(a) * r;
    camera.position.z = controls.target.z + Math.sin(a) * r;
  }
  controls.update();

  /* 当前场景的动态 */
  const obj = SC[currentScene];
  if (obj) {
    obj.orgList.forEach(function (org) {
      /* 呼吸式浮动 */
      if (!org.dead) {
        org.group.position.y = org.baseY + Math.sin(elapsed * 1.15 + org.phase) * 0.055;
      }
      /* 鹰扇翅膀 */
      if (org.wings && !org.dead) {
        const f = Math.sin(elapsed * 2.6 + org.phase);
        org.wings[0].rotation.z = 0.14 + f * 0.32;
        org.wings[1].rotation.z = -0.14 - f * 0.32;
      }
      /* 点击错误时抖动 */
      if (org.shake > 0) {
        org.shake -= dt;
        org.group.position.x = org.def.pos[0] + Math.sin(elapsed * 60) * 0.09 * Math.max(0, org.shake);
        if (org.shake <= 0) org.group.position.x = org.def.pos[0];
      }
      /* 移除动画：缩小消失 */
      if (org.dead) {
        org.killT = (org.killT || 0) + dt;
        const k = clamp(org.killT / 0.55, 0, 1);
        org.group.scale.setScalar(1 - k);
        if (k >= 1) org.group.visible = false;
      }
    });

    /* 高亮脉冲 */
    Object.keys(obj.hl).forEach(function (id) {
      const org = obj.orgs[id];
      if (!org) return;
      const v = 0.34 + 0.30 * Math.sin(elapsed * 4.2);
      org.mats.forEach(function (x) { if (x.m.emissive) x.m.emissiveIntensity = v; });
    });

    updateEdges(obj, dt);
    if (obj.mixer) obj.mixer.update(dt);
  }

  renderer.render(obj ? obj.scene : SC.A.scene, camera);
  updateTags();
}

     ===================================================================== -->
<script>
(function () {
  var finished = false;
  function showOffline() {
    if (finished) return;
    finished = true;
    var b = document.getElementById('boot');
    b.querySelector('.ring').style.display = 'none';
    b.querySelector('.t').textContent = '无法加载 3D 引擎';
    var e = document.getElementById('bootErr');
    e.style.display = 'block';
    e.innerHTML = '本课件需要 three.js。请确认 <code>libs/three.bundle.js</code> 与 HTML 放在同一目录，'
      + '或者连接网络后刷新（会自动从 CDN 获取）。<br>建议双击 <code>启动本地服务器.bat</code> 后访问 http://127.0.0.1:8000 。';
  }
  var wd = setTimeout(showOffline, 8000);

  function ready(T) {
    if (finished) return;
    if (!T || !T.Scene) { loadCDN(); return; }
    finished = true; clearTimeout(wd);
    window.THREE = T;
    window.__READY(T);
  }

  /* 路径 1：本地离线包（经典脚本，file:// 下可用） */
  function loadLocal() {
    var s = document.createElement('script');
    s.src = '../assets/three.bundle.js';
    s.onload = function () { ready(window.THREE); };
    s.onerror = loadCDN;
    document.head.appendChild(s);
  }
  /* 路径 2：CDN（ES Module + importmap） */
  function loadCDN() {
    var s = document.createElement('script');
    s.type = 'module';
    s.textContent = [
      "import * as T from 'three';",
      "import { OrbitControls } from 'three/addons/controls/OrbitControls.js';",
      "import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';",
      "window.THREE = Object.assign({}, T, { OrbitControls: OrbitControls, GLTFLoader: GLTFLoader });",
      "window.__READY(window.THREE);"
    ].join('\n');
    s.onerror = showOffline;
    document.head.appendChild(s);
  }
  loadLocal();
})();
</script>
